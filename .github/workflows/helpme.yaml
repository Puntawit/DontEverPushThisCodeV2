name: DevSecOps Pipeline
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write
  pull-requests: write
  security-events: write  # required to upload SARIF to GitHub Security tab
  actions: read

jobs:
    secret-scanning:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                fetch-depth: 0

            - name: Run TruffleHog
              uses: trufflesecurity/trufflehog@main
              continue-on-error: true # NOTE THAT THIS IS NOT A BEST PRACTICE — ideally we would fail here and fix secrets before moving on to later gates, but for demo purposes we want to see results from all scanners.
              with:
                path: ./
                base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && github.event.before || '' }}
                head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'push' && github.sha || '' }}
                extra_args: --results=verified

            - name: Run Gitleaks
              uses: gitleaks/gitleaks-action@v3
              continue-on-error: true
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
                GITLEAKS_ENABLE_SUMMARY: "true"
                GITLEAKS_ENABLE_COMMENTS: "false"

            - name: Upload Gitleaks SARIF to Security tab
              if: ${{ !cancelled() && hashFiles('results.sarif') != '' }}
              uses: github/codeql-action/upload-sarif@v4
              continue-on-error: true
              with:
                sarif_file: results.sarif
                category: gitleaks

    sast-scan:
        runs-on: ubuntu-latest
        needs: secret-scanning # this line means "you need to finish the secret-scanning job before starting this one (sast-scan)"
        if: ${{ !cancelled() }} 
        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                fetch-depth: 0

            - name: SonarQube Scan
              uses: SonarSource/sonarqube-scan-action@v7.1.0
              continue-on-error: true
              env:
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    codeql-scan:
        runs-on: ubuntu-latest
        needs: secret-scanning
        if: ${{ !cancelled() }} 
        strategy:
            matrix:
                language: [ 'javascript-typescript' ]
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Initialize CodeQL
              uses: github/codeql-action/init@v4
              with:
                languages: ${{ matrix.language }}
                queries: security-extended,security-and-quality

            - name: Perform CodeQL Analysis
              uses: github/codeql-action/analyze@v4
              with:
                category: "/language:${{ matrix.language }}"

    dependency-scanning:
        runs-on: ubuntu-latest
        needs: [sast-scan, secret-scanning]
        if: ${{ !cancelled() }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Set up Node 20
              uses: actions/setup-node@v6
              with:
                node-version: '20'
                cache: npm
            - name: Install dependencies
              run: npm ci --ignore-scripts
            - name: Depcheck
              uses: dependency-check/Dependency-Check_Action@main
              continue-on-error: true # NOTE THAT THIS IS NOT A BEST PRACTICE — ideally we would fail here and fix secrets before moving on to later gates, but for demo purposes we want to see results from all scanners.
              id: Depcheck # give this step an ID so we can reference its outputs in later steps (e.g. for SARIF upload)
              with:
                project: 'DontEverPushThisCodeV2'
                path: '.' # scan current directory (which should be the repo root after checkout)
                format: 'ALL'
                out: 'reports'
                args: >
                    --failOnCVSS 7
                    --enableRetired

            - name: Upload Depcheck SARIF to Security tab
              if: always() 
              uses: github/codeql-action/upload-sarif@v4
              continue-on-error: true
              with:
                  sarif_file: reports/dependency-check-report.sarif
                  category: dependency-check

            - name: Upload Depcheck HTML report as artifact
              if: always() 
              uses: actions/upload-artifact@v6
              with:
                name: depcheck-report
                path: reports/

    image-scanning:
        runs-on: ubuntu-latest
        needs: [dependency-scanning]
        if: ${{ !cancelled() }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Build Docker image
              run: docker build -t my-app:latest .
            - name: Trivy Scan
              uses: aquasecurity/trivy-action@master
              continue-on-error: true
              with:
                image-ref: 'my-app:latest'
                format: 'sarif'
                output: 'trivy-results.sarif'
                severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
                ignore-unfixed: 'false'

            - name: Upload Trivy SARIF to Security tab
              if: ${{ !cancelled() && hashFiles('trivy-results.sarif') != '' }}
              uses: github/codeql-action/upload-sarif@v4
              continue-on-error: true
              with:
                sarif_file: trivy-results.sarif
                category: trivy
            - name: Upload Trivy report
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v6
              with:
                name: trivy-report
                path: trivy-results.sarif
